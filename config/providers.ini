# Provider configuration consumed by airflow-provider-configurator.
# Real, unmodified Airflow section names (spec WF029 1.3.1).
# Deliberately avoids coordinator-owned sections
# (core, database, api, api_auth, scheduler, dag_processor, triggerer).

[gcs]
conn_id = default_gcp

[bigquery]
use_legacy_sql = False

[logging]
remote_logging = True
remote_base_log_folder = s3://your-airflow-logs-bucket/logs
